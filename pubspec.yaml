    - Assets/icons/filled/
    - Assets/icons/outline/
    - Assets/icons/notification_icon/
    - Assets/icons/feature_card_icons/
    - Assets/icons/ai_match/
    - Assets/icons/influence/
    - Assets/icons/vibes/
    - shorebird.yaml

  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: Assets/fonts/noto_color_emoji/NotoColorEmoji-Regular.ttf
    - family: sfProDisplay
      fonts:
        - asset: Assets/fonts/sf_pro_display/sf_regular.ttf
          weight: 400
        - asset: Assets/fonts/sf_pro_display/sf_medium.ttf
          weight: 500
        - asset: Assets/fonts/sf_pro_display/sf_bold.ttf
          weight: 700
